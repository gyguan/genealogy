name: Agent Fix Issue 1034

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/issue-1034-member-review-source-mybatis'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-1034-member-review-source-mybatis
          fetch-depth: 0

      - name: Verify and apply pending patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .agent/issue1034-fix.patch || ! -f .agent/issue1034-fix.sha256 ]]; then
            echo 'applied=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha256sum --check --strict .agent/issue1034-fix.sha256
          git apply --check .agent/issue1034-fix.patch
          git apply .agent/issue1034-fix.patch
          rm -rf .agent
          echo 'applied=true' >> "$GITHUB_OUTPUT"

      - name: Commit verified fix
        if: steps.patch.outputs.applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(issue-1034): apply verified CI correction'
          git push origin HEAD:agent/issue-1034-member-review-source-mybatis
