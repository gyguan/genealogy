name: Agent Apply Issue 1033

on:
  push:
    branches:
      - agent/issue-1033-person-mybatis
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1033-person-mybatis
          fetch-depth: 0
      - name: Apply implementation
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/agent/issue-1033.patch.gz.b64 | gzip -d > /tmp/issue-1033.patch
          git apply --check /tmp/issue-1033.patch
          git apply /tmp/issue-1033.patch
          rm -f .github/agent/issue-1033.patch.gz.b64
          rm -f .github/workflows/agent-source-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(person): migrate persistence to MyBatis Plus"
          git push origin HEAD:agent/issue-1033-person-mybatis
