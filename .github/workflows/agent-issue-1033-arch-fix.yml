name: Agent Apply Issue 1033 Architecture Fix

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/issue-1033-person-mybatis' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1033-person-mybatis
          fetch-depth: 0
      - name: Apply architecture fixes
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/agent/issue-1033-current-arch.patch
          git apply .github/agent/issue-1033-current-arch.patch
          rm -rf .github/agent
          rm -f .github/workflows/agent-issue-1033-arch-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(person): preserve repository architecture boundary"
          git push origin HEAD:agent/issue-1033-person-mybatis
