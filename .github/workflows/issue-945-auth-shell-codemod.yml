name: Issue 945 Auth Shell Codemod

on:
  push:
    branches:
      - agent/issue-945-business-visual-boundaries

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-945-business-visual-boundaries
      - name: Migrate auth shell to Ant Design Layout and Card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/genealogy-web/src/features/auth/AuthPage.tsx')
          source = path.read_text()
          source = source.replace('  Input,\n  Modal,', '  Input,\n  Layout,\n  Card,\n  Modal,')
          source = source.replace('<div className="commercial-auth-layout">', '<Layout className="commercial-auth-layout">', 1)
          source = source.replace('<section className="commercial-auth-brand" aria-label="族谱管理平台介绍">', '<Layout.Sider className="commercial-auth-brand" width="48%" breakpoint="lg" collapsedWidth={0} aria-label="族谱管理平台介绍">', 1)
          source = source.replace('</section>\n\n      <section className="commercial-auth-panel" aria-label="账号认证">', '</Layout.Sider>\n\n      <Layout.Content className="commercial-auth-panel" aria-label="账号认证">', 1)
          source = source.replace('<div className="commercial-auth-card">', '<Card className="commercial-auth-card" bordered={false}>', 1)
          source = source.replace('        </div>\n        <footer className="commercial-auth-footer">', '        </Card>\n        <footer className="commercial-auth-footer">', 1)
          source = source.replace('      </section>\n    </div>\n  );', '      </Layout.Content>\n    </Layout>\n  );', 1)
          if source.count('<Layout className="commercial-auth-layout">') != 1 or source.count('<Card className="commercial-auth-card"') != 1:
              raise SystemExit('auth shell codemod did not apply exactly once')
          path.write_text(source)
          PY
          rm .github/workflows/issue-945-auth-shell-codemod.yml
      - name: Commit codemod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/genealogy-web/src/features/auth/AuthPage.tsx .github/workflows/issue-945-auth-shell-codemod.yml
          git commit -m "refactor(auth): use Ant Design Layout and Card shell"
          git push origin HEAD:agent/issue-945-business-visual-boundaries
