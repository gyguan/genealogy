name: Agent Normalize Issue 1033 Dashboard Mapping

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/issue-1033-person-mybatis' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1033-person-mybatis
          fetch-depth: 0
      - name: Normalize count projection types
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('backend/genealogy-backend/src/main/java/com/genealogy/person/repository/query/PersonDashboardSummary.java'): [
                  ('long peopleTotal', 'Long peopleTotal'),
                  ('long generationMaintained', 'Long generationMaintained'),
                  ('long vitalDatesMaintained', 'Long vitalDatesMaintained'),
                  ('long biographyMaintained', 'Long biographyMaintained'),
                  ('long keyInfoMissing', 'Long keyInfoMissing'),
                  ('long coveredBranches', 'Long coveredBranches'),
              ],
              Path('backend/genealogy-backend/src/main/java/com/genealogy/person/repository/query/PersonDashboardBucket.java'): [
                  ('long count', 'Long count'),
              ],
              Path('backend/genealogy-backend/src/main/java/com/genealogy/person/repository/query/PersonDashboardDailyCount.java'): [
                  ('long count', 'Long count'),
              ],
              Path('backend/genealogy-backend/src/main/resources/mapper/person/PersonQueryMapper.xml'): [
                  ('javaType="_long"', 'javaType="java.lang.Long"'),
              ],
              Path('backend/genealogy-backend/src/main/java/com/genealogy/person/repository/PersonRepository.java'): [
                  ('new PersonDashboardSummary(0, 0, 0, 0, 0, 0)', 'new PersonDashboardSummary(0L, 0L, 0L, 0L, 0L, 0L)'),
              ],
              Path('backend/genealogy-backend/src/test/java/com/genealogy/integration/PersonMybatisPostgreSqlIT.java'): [
                  ('.peopleTotal()).isEqualTo(2);', '.peopleTotal()).isEqualTo(2L);'),
                  ('.generationMaintained()).isEqualTo(1);', '.generationMaintained()).isEqualTo(1L);'),
                  ('.biographyMaintained()).isEqualTo(1);', '.biographyMaintained()).isEqualTo(1L);'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          rm -f .github/agent/issue-1033-postgresql-diagnostic.txt
          rmdir .github/agent 2>/dev/null || true
          rm -f .github/workflows/agent-issue-1033-dashboard-wrapper-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(person): align dashboard projections with JDBC Long values"
          git push origin HEAD:agent/issue-1033-person-mybatis
