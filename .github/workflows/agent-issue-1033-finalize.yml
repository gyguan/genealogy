name: Agent Finalize Issue 1033

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/issue-1033-person-mybatis' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: '1044'
      ISSUE_NUMBER: '1033'
      BRANCH_NAME: agent/issue-1033-person-mybatis
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1033-person-mybatis
          fetch-depth: 0

      - name: Wait for required pull request gates
        shell: bash
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          echo "TESTED_SHA=${tested_sha}" >> "$GITHUB_ENV"
          required=(
            "Backend CI"
            "Functional E2E"
            "Security Penetration"
            "Member Branch Scope E2E"
            "Database Migration Governance"
            "Backend Configuration Governance"
          )
          for attempt in $(seq 1 150); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&branch=${BRANCH_NAME}&per_page=100")"
            all_success=true
            for name in "${required[@]}"; do
              entry="$(jq -c --arg name "$name" --arg sha "$tested_sha" '
                [.workflow_runs[] | select(.name == $name and .head_sha == $sha)]
                | sort_by(.created_at) | last // empty
              ' <<<"$runs")"
              if [[ -z "$entry" ]]; then
                echo "${name}: not started"
                all_success=false
                continue
              fi
              status="$(jq -r '.status' <<<"$entry")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$entry")"
              url="$(jq -r '.html_url' <<<"$entry")"
              echo "${name}: status=${status}, conclusion=${conclusion}, url=${url}"
              if [[ "$status" == "completed" && "$conclusion" != "success" ]]; then
                echo "Required gate failed: ${name}" >&2
                exit 1
              fi
              if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
                all_success=false
              fi
            done
            if [[ "$all_success" == "true" ]]; then
              exit 0
            fi
            sleep 20
          done
          echo "Timed out waiting for required gates" >&2
          exit 1

      - name: Verify no unresolved review threads
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          unresolved="$(gh api graphql \
            -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' \
            -f owner="$owner" -f repo="$repo" -F number="$PR_NUMBER" \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')"
          test "$unresolved" = "0"

      - name: Remove temporary execution files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/agent
          rm -f .github/workflows/agent-issue-1033-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(issue-1033): remove temporary verification files"
          cleanup_sha="$(git rev-parse HEAD)"
          echo "CLEANUP_SHA=${cleanup_sha}" >> "$GITHUB_ENV"
          changed="$(git diff --name-only "$TESTED_SHA" "$cleanup_sha")"
          echo "$changed"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              .github/agent/*|.github/workflows/agent-issue-1033-finalize.yml) ;;
              *) echo "Unexpected cleanup change: $path" >&2; exit 1 ;;
            esac
          done <<<"$changed"
          git push origin HEAD:"$BRANCH_NAME"

      - name: Update PR evidence and mark ready
        shell: bash
        run: |
          set -euo pipefail
          body="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          if ! grep -q "## 最终验收结果" <<<"$body"; then
            body="${body}

## 最终验收结果

- 验证代码 Head：\`${TESTED_SHA}\`
- Backend CI：通过
- PostgreSQL Integration / Functional E2E：通过
- Security Penetration：通过
- Member Branch Scope E2E：通过
- Database Migration Governance：通过
- Backend Configuration Governance：通过
- 未解决 Review Thread：0
- 清理提交仅删除临时诊断与收口文件：\`${CLEANUP_SHA}\`
"
          fi
          jq -n --arg body "$body" '{body:$body}' > /tmp/pr-body.json
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --input /tmp/pr-body.json >/dev/null
          gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" || true

      - name: Squash merge and verify issue closure
        shell: bash
        run: |
          set -euo pipefail
          result="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=squash \
            -f sha="$CLEANUP_SHA" \
            -f commit_title='[持久化框架迁移 2/5] 迁移人物写模型、动态查询与统计读模型 (#1044)' \
            -f commit_message='Closes #1033')"
          test "$(jq -r '.merged' <<<"$result")" = "true"
          state="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" --jq .state)"
          if [[ "$state" != "closed" ]]; then
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Issue #1033 已完成并通过全部门禁，PR #1044 已 squash 合并。验证代码 Head：\`${TESTED_SHA}\`；合并前清理提交：\`${CLEANUP_SHA}\`。"
