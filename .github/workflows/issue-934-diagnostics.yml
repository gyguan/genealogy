name: Issue 934 diagnostics

on:
  push:
    branches:
      - agent/issue-934-antd-governance
    paths:
      - .github/workflows/issue-934-diagnostics.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: frontend/genealogy-web/package-lock.json
      - name: Install
        working-directory: frontend/genealogy-web
        run: npm ci
      - name: Capture governance output
        working-directory: frontend/genealogy-web
        shell: bash
        run: |
          set +e
          npm run test:dom-governance > issue-934-governance.log 2>&1
          status=$?
          cat issue-934-governance.log
          echo "$status" > issue-934-governance.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: issue-934-diagnostics
          path: |
            frontend/genealogy-web/issue-934-governance.log
            frontend/genealogy-web/issue-934-governance.status
