name: Issue 1037 Restricted Patch

on:
  pull_request:
    branches: ["main"]
    paths:
      - "tasks/issue-1037-execution.md"
      - ".github/workflows/agent-issue-1037-restricted-patch.yml"

concurrency:
  group: issue-1037-restricted-patch
  cancel-in-progress: false

jobs:
  apply-patch:
    if: >-
      github.event.pull_request.head.ref == 'agent/issue-1037-remove-jpa-final-migration' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout exact implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-1037-remove-jpa-final-migration
          fetch-depth: 0

      - name: Verify and apply execution-board payload
        env:
          EXPECTED_REMOTE_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: agent/issue-1037-remove-jpa-final-migration
        shell: bash
        run: |
          set -euo pipefail
          transport=tasks/issue-1037-execution.md
          grep -q '^ISSUE1037_PATCH_PAYLOAD_V1$' "$transport" || { echo 'No payload marker'; exit 1; }
          expected_parent="$(sed -n '2s/^parent=//p' "$transport")"
          expected_digest="$(sed -n '3s/^sha256=//p' "$transport")"
          patch_format="$(sed -n '4s/^format=//p' "$transport")"
          commit_message="$(sed -n '5s/^message=//p' "$transport")"
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          mapfile -t changed < <(git diff --name-only "$expected_parent"..HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$transport"
          tail -n +7 "$transport" | tr -d '\n\r ' > /tmp/issue-1037.patch.b64
          echo "$expected_digest  /tmp/issue-1037.patch.b64" | sha256sum --check
          base64 --decode /tmp/issue-1037.patch.b64 > /tmp/issue-1037.patch.gz
          test "$patch_format" = gzip-base64
          gzip --decompress --stdout /tmp/issue-1037.patch.gz > /tmp/issue-1037.patch
          git apply --check /tmp/issue-1037.patch
          git restore --source="$expected_parent" --staged --worktree "$transport"
          git apply --index /tmp/issue-1037.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$commit_message"
          generated_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_REMOTE_HEAD"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_REMOTE_HEAD" origin "$generated_head:refs/heads/$TARGET_BRANCH"

      - name: Dispatch verification for the new head
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: agent/issue-1037-remove-jpa-final-migration
        shell: bash
        run: |
          set -euo pipefail
          for workflow_id in 302465761 321110189 321794444 321993175; do
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/dispatches" -f ref="$TARGET_REF"
          done
