name: Issue 1037 Restricted Patch

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".agent/issue-1037-patch-ready"
      - ".github/workflows/agent-issue-1037-restricted-patch.yml"

concurrency:
  group: issue-1037-restricted-patch
  cancel-in-progress: false

jobs:
  apply-patch:
    if: >-
      github.event.pull_request.head.ref == 'agent/issue-1037-remove-jpa-final-migration' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout exact implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-1037-remove-jpa-final-migration
          fetch-depth: 0

      - name: Verify and apply restricted patch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REMOTE_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: agent/issue-1037-remove-jpa-final-migration
        shell: bash
        run: |
          set -euo pipefail
          echo "Stage: required transport files"
          required=(.agent/issue-1037-patch-parent .agent/issue-1037-patch-message .agent/issue-1037-patch-ready)
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required file: $file" >&2; exit 1; }
          done
          shopt -s nullglob
          parts=(.agent/issue-1037-patch.part-*)
          test "${#parts[@]}" -gt 0 || { echo "No patch parts found" >&2; exit 1; }

          is_transport_path() {
            case "$1" in
              .agent/issue-1037-patch-parent|.agent/issue-1037-patch-message|.agent/issue-1037-patch-ready|.agent/issue-1037-patch.part-*) return 0 ;;
              *) return 1 ;;
            esac
          }

          echo "Stage: parent commit and allowed range"
          expected_parent="$(tr -d '[:space:]' < .agent/issue-1037-patch-parent)"
          cursor="$(git rev-parse HEAD)"
          while true; do
            mapfile -t commit_paths < <(git diff-tree --no-commit-id --name-only -r "$cursor" | sort)
            transport_only=true
            for path in "${commit_paths[@]}"; do
              if ! is_transport_path "$path"; then
                transport_only=false
                break
              fi
            done
            if [[ "$transport_only" == false ]]; then
              actual_parent="$cursor"
              break
            fi
            cursor="$(git rev-parse "${cursor}^")"
          done
          echo "Declared parent: $expected_parent"
          echo "Derived parent:  $actual_parent"
          echo "Current head:    $(git rev-parse HEAD)"
          test "$actual_parent" = "$expected_parent" || {
            echo "Declared parent does not match the first non-transport commit" >&2
            exit 1
          }
          mapfile -t changed < <(git diff --name-only "$actual_parent"..HEAD | sort)
          printf 'Changed transport range:\n%s\n' "${changed[*]}"
          for path in "${changed[@]}"; do
            is_transport_path "$path" || { echo "Patch trigger range contains unexpected file: $path" >&2; exit 1; }
          done

          echo "Stage: part validation"
          for part in "${parts[@]}"; do
            echo "Checking $part ($(wc -c < "$part") bytes)"
            if ! base64 --decode "$part" >/dev/null 2>&1; then
              echo "Invalid Base64 part: $part" >&2
              LC_ALL=C grep -n '[^A-Za-z0-9+/=]' "$part" || true
              exit 1
            fi
          done
          cat "${parts[@]}" > /tmp/issue-1037.patch.b64
          expected_digest="$(tr -d '[:space:]' < .agent/issue-1037-patch-ready)"
          echo "$expected_digest  /tmp/issue-1037.patch.b64" | sha256sum --check

          echo "Stage: patch apply"
          base64 --decode /tmp/issue-1037.patch.b64 > /tmp/issue-1037.patch
          git apply --check /tmp/issue-1037.patch
          git apply --index /tmp/issue-1037.patch
          commit_message="$(cat .agent/issue-1037-patch-message)"
          git rm .agent/issue-1037-patch-parent .agent/issue-1037-patch-message .agent/issue-1037-patch-ready "${parts[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$commit_message"

          generated_head="$(git rev-parse HEAD)"
          remote_head="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')"
          echo "Generated business head: $generated_head"
          echo "Remote implementation head: $remote_head"
          test "$remote_head" = "$EXPECTED_REMOTE_HEAD" || {
            echo "Remote branch moved: expected $EXPECTED_REMOTE_HEAD, found $remote_head" >&2
            exit 1
          }
          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${TARGET_BRANCH}" -f sha="$generated_head" -F force=true >/dev/null
          confirmed_head="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')"
          test "$confirmed_head" = "$generated_head" || {
            echo "Ref update did not persist: expected $generated_head, found $confirmed_head" >&2
            exit 1
          }

      - name: Dispatch verification for the new head
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: agent/issue-1037-remove-jpa-final-migration
        shell: bash
        run: |
          set -euo pipefail
          for workflow_id in 302465761 321110189 321794444 321993175; do
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/dispatches" -f ref="$TARGET_REF"
          done
