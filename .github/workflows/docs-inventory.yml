name: Docs Inventory

on:
  push:
    branches:
      - agent/full-docs-audit
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Markdown inventory
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          sha_by_path = {}
          out = subprocess.check_output(['git', 'ls-tree', '-r', 'HEAD', 'docs'], text=True)
          for line in out.splitlines():
              meta, path = line.split('\t', 1)
              _, _, sha = meta.split()
              sha_by_path[path] = sha
          rows = []
          for path in sorted(Path('docs').rglob('*.md')):
              text = path.read_text(encoding='utf-8', errors='replace')
              title = next((line[2:].strip() for line in text.splitlines() if line.startswith('# ')), '')
              rows.append(f"{path.as_posix()}\t{sha_by_path.get(path.as_posix(), '')}\t{len(text.splitlines())}\t{title}")
          Path('docs-inventory.tsv').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          print('\n'.join(rows))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: docs-inventory
          path: docs-inventory.tsv
          retention-days: 1
