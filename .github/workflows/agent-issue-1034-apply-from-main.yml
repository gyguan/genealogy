name: Agent Apply Issue 1034 From Main

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/issue-1034-member-review-source-mybatis'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-1034-member-review-source-mybatis
          fetch-depth: 0

      - name: Verify and apply migration implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/issue1034.small* > /tmp/issue1034.b64
          echo '42432b0716963edafab7fbf15f631cc21f69ccbb2f107374b5ac61b42ed0bbd4  /tmp/issue1034.b64' | sha256sum --check --strict
          base64 -d /tmp/issue1034.b64 > /tmp/issue1034.tar.gz
          echo '2cffbef423a5e1f3e34a153e0aac818882d8f4ca3bb461a3260a7572d09976f0  /tmp/issue1034.tar.gz' | sha256sum --check --strict
          tar -tzf /tmp/issue1034.tar.gz > /tmp/issue1034-files.txt
          test "$(wc -l < /tmp/issue1034-files.txt)" -eq 80
          tar -xzf /tmp/issue1034.tar.gz
          rm -rf .agent
          rm -f .github/workflows/agent-issue-1034-apply.yml

      - name: Commit implementation and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(issue-1034): migrate member review and source persistence'
          git push origin HEAD:agent/issue-1034-member-review-source-mybatis
