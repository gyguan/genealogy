name: Functional E2E

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "backend/genealogy-backend/**"
      - "frontend/genealogy-web/**"
      - "docs/testing/**"
      - "tasks/issue-81*.md"
      - ".github/workflows/functional-e2e.yml"

permissions:
  contents: read

concurrency:
  group: functional-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  functional-test:
    name: PostgreSQL Integration and Real Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: genealogy
          POSTGRES_USER: genealogy
          POSTGRES_PASSWORD: genealogy
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U genealogy -d genealogy"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/genealogy
      SPRING_DATASOURCE_USERNAME: genealogy
      SPRING_DATASOURCE_PASSWORD: genealogy
      SPRING_PROFILES_ACTIVE: functional-test
      VITE_API_PROXY_TARGET: http://127.0.0.1:8080
      E2E_BASE_URL: http://127.0.0.1:5179
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: genealogy
      PGUSER: genealogy
      PGPASSWORD: genealogy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/genealogy-web/package.json

      - name: Generate isolated functional test identities
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            echo "FUNCTIONAL_TEST_RUN_ID=gha-${suffix}"
            echo "FUNCTIONAL_TEST_ADMIN_USERNAME=ft_admin_${suffix}"
            echo "FUNCTIONAL_TEST_ADMIN_PASSWORD=$(openssl rand -hex 16)"
            echo "FUNCTIONAL_TEST_EDITOR_USERNAME=ft_editor_${suffix}"
            echo "FUNCTIONAL_TEST_EDITOR_PASSWORD=$(openssl rand -hex 16)"
            echo "FUNCTIONAL_TEST_REVIEWER_USERNAME=ft_reviewer_${suffix}"
            echo "FUNCTIONAL_TEST_REVIEWER_PASSWORD=$(openssl rand -hex 16)"
            echo "FUNCTIONAL_TEST_VIEWER_USERNAME=ft_restricted_${suffix}"
            echo "FUNCTIONAL_TEST_VIEWER_PASSWORD=$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"

      - name: Run PostgreSQL integration tests
        working-directory: backend/genealogy-backend
        shell: bash
        run: |
          set -o pipefail
          mvn -B -DskipITs=false verify 2>&1 | tee ../../postgresql-integration.log

      - name: Start functional backend
        working-directory: backend/genealogy-backend
        shell: bash
        run: |
          set -euo pipefail
          java -jar target/genealogy-backend-0.1.0-SNAPSHOT.jar > ../../backend-functional.log 2>&1 &
          echo $! > ../../backend-functional.pid
          for attempt in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/8080) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not open port 8080" >&2
          tail -n 200 ../../backend-functional.log || true
          exit 1

      - name: Register isolated test accounts
        shell: bash
        run: |
          set -euo pipefail
          register_user() {
            local username="$1"
            local password="$2"
            local display_name="$3"
            jq -nc \
              --arg username "$username" \
              --arg password "$password" \
              --arg displayName "$display_name" \
              '{username:$username,password:$password,displayName:$displayName,phone:null,email:null}' \
              | curl --fail-with-body --silent --show-error \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  http://127.0.0.1:8080/api/v1/auth/register
          }

          register_user "$FUNCTIONAL_TEST_ADMIN_USERNAME" "$FUNCTIONAL_TEST_ADMIN_PASSWORD" "功能测试管理员" > admin-register.json
          register_user "$FUNCTIONAL_TEST_EDITOR_USERNAME" "$FUNCTIONAL_TEST_EDITOR_PASSWORD" "功能测试编辑者" > editor-register.json
          register_user "$FUNCTIONAL_TEST_REVIEWER_USERNAME" "$FUNCTIONAL_TEST_REVIEWER_PASSWORD" "功能测试审核员" > reviewer-register.json
          register_user "$FUNCTIONAL_TEST_VIEWER_USERNAME" "$FUNCTIONAL_TEST_VIEWER_PASSWORD" "受限宗族账号" > viewer-register.json

      - name: Seed restricted account in another clan
        shell: bash
        run: |
          set -euo pipefail
          jq -nc \
            --arg username "$FUNCTIONAL_TEST_VIEWER_USERNAME" \
            --arg password "$FUNCTIONAL_TEST_VIEWER_PASSWORD" \
            '{username:$username,password:$password,rememberMe:false}' \
            | curl --fail-with-body --silent --show-error \
                -c viewer.cookies \
                -H 'Content-Type: application/json' \
                --data-binary @- \
                http://127.0.0.1:8080/api/v1/auth/login \
                > viewer-login.json

          csrf_token="$(jq -r '.data.csrfToken // empty' viewer-login.json)"
          test -n "$csrf_token"

          jq -nc \
            --arg clanName "受限账号基线宗族-${FUNCTIONAL_TEST_RUN_ID}" \
            '{clanCode:null,clanName:$clanName,surname:"测",hallName:"测试堂",commandery:null,originPlace:"CI",description:"功能测试隔离数据"}' \
            | curl --fail-with-body --silent --show-error \
                -b viewer.cookies \
                -H 'Content-Type: application/json' \
                -H "X-CSRF-Token: ${csrf_token}" \
                --data-binary @- \
                http://127.0.0.1:8080/api/v1/clans \
                > viewer-seed-clan.json

      - name: Seed review and lineage scenario
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee seed-functional.log) 2>&1
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

          jq -nc \
            --arg username "$FUNCTIONAL_TEST_EDITOR_USERNAME" \
            --arg password "$FUNCTIONAL_TEST_EDITOR_PASSWORD" \
            '{username:$username,password:$password,rememberMe:false}' \
            | curl --fail-with-body --silent --show-error \
                -c editor.cookies \
                -H 'Content-Type: application/json' \
                --data-binary @- \
                http://127.0.0.1:8080/api/v1/auth/login \
                > editor-login.json
          editor_csrf="$(jq -r '.data.csrfToken // empty' editor-login.json)"
          test -n "$editor_csrf"
          echo "editor login ready"

          jq -nc \
            --arg clanName "审核世系核心宗族-${FUNCTIONAL_TEST_RUN_ID}" \
            '{clanCode:null,clanName:$clanName,surname:"黄",hallName:"敦本堂",commandery:"江夏郡",originPlace:"CI",description:"真实审核与世系功能测试"}' \
            | curl --fail-with-body --silent --show-error \
                -b editor.cookies \
                -H 'Content-Type: application/json' \
                -H "X-CSRF-Token: ${editor_csrf}" \
                --data-binary @- \
                http://127.0.0.1:8080/api/v1/clans \
                > core-clan.json
          core_clan_id="$(jq -r '.data.id // empty' core-clan.json)"
          test -n "$core_clan_id"
          echo "core clan ready id=${core_clan_id}"

          jq -nc \
            --arg branchName "核心支派-${FUNCTIONAL_TEST_RUN_ID}" \
            '{parentId:null,branchName:$branchName,sortOrder:1,founderPersonId:null,migrationFrom:"江夏",migrationTo:"长沙",managerMemberId:null,description:"功能测试核心支派"}' \
            | curl --fail-with-body --silent --show-error \
                -b editor.cookies \
                -H 'Content-Type: application/json' \
                -H "X-CSRF-Token: ${editor_csrf}" \
                --data-binary @- \
                "http://127.0.0.1:8080/api/v1/clans/${core_clan_id}/branches" \
                > core-branch.json
          core_branch_id="$(jq -r '.data.id // empty' core-branch.json)"
          test -n "$core_branch_id"
          psql -v ON_ERROR_STOP=1 -c "update branch set status = 'official' where id = ${core_branch_id}"
          echo "core branch ready id=${core_branch_id}"

          create_person() {
            local person_name="$1"
            local generation_no="$2"
            local person_code="$3"
            jq -nc \
              --argjson branchId "$core_branch_id" \
              --arg personCode "$person_code" \
              --arg name "$person_name" \
              --argjson generationNo "$generation_no" \
              '{branchId:$branchId,personCode:$personCode,name:$name,genealogyName:null,courtesyName:null,aliasName:null,gender:"male",generationNo:$generationNo,generationWord:null,rankInFamily:null,birthDate:null,birthDatePrecision:null,deathDate:null,deathDatePrecision:null,isLiving:false,birthPlace:null,residencePlace:null,occupation:null,education:null,titleOrHonor:null,biography:null,tombPlace:null,epitaph:null,hasDescendant:true,lineageStatus:"normal",privacyLevel:"clan_only",dataStatus:"draft",confirmDuplicate:true}' \
              | curl --fail-with-body --silent --show-error \
                  -b editor.cookies \
                  -H 'Content-Type: application/json' \
                  -H "X-CSRF-Token: ${editor_csrf}" \
                  --data-binary @- \
                  "http://127.0.0.1:8080/api/v1/clans/${core_clan_id}/persons"
          }

          create_person "黄测试始祖-${FUNCTIONAL_TEST_RUN_ID}" 1 "FT-R-${GITHUB_RUN_ID}" > core-root-person.json
          create_person "黄测试承继-${FUNCTIONAL_TEST_RUN_ID}" 2 "FT-M-${GITHUB_RUN_ID}" > core-middle-person.json
          create_person "黄测试后代-${FUNCTIONAL_TEST_RUN_ID}" 3 "FT-C-${GITHUB_RUN_ID}" > core-child-person.json
          root_person_id="$(jq -r '.data.id // empty' core-root-person.json)"
          middle_person_id="$(jq -r '.data.id // empty' core-middle-person.json)"
          child_person_id="$(jq -r '.data.id // empty' core-child-person.json)"
          test -n "$root_person_id" && test -n "$middle_person_id" && test -n "$child_person_id"
          echo "core persons ready root=${root_person_id} middle=${middle_person_id} child=${child_person_id}"

          create_relationship() {
            local from_id="$1"
            local to_id="$2"
            jq -nc \
              --argjson fromPersonId "$from_id" \
              --argjson toPersonId "$to_id" \
              '{fromPersonId:$fromPersonId,toPersonId:$toPersonId,relationType:"father_of",relationLabel:"父子",relationCategory:"blood",ritualRelationType:null,successionReason:null,successorBranchId:null,isLineageRelation:true,isBiological:true,isPrimary:true,description:"功能测试世系关系",confidenceLevel:"high"}' \
              | curl --fail-with-body --silent --show-error \
                  -b editor.cookies \
                  -H 'Content-Type: application/json' \
                  -H "X-CSRF-Token: ${editor_csrf}" \
                  --data-binary @- \
                  "http://127.0.0.1:8080/api/v1/clans/${core_clan_id}/relationships"
          }

          create_relationship "$root_person_id" "$middle_person_id" > core-relation-1.json
          create_relationship "$middle_person_id" "$child_person_id" > core-relation-2.json
          relation_1_id="$(jq -r '.data.id // empty' core-relation-1.json)"
          relation_2_id="$(jq -r '.data.id // empty' core-relation-2.json)"
          test -n "$relation_1_id" && test -n "$relation_2_id"
          echo "core relationships ready first=${relation_1_id} second=${relation_2_id}"

          psql -v ON_ERROR_STOP=1 -c "update person set data_status = 'official' where id in (${root_person_id}, ${middle_person_id}, ${child_person_id})"
          psql -v ON_ERROR_STOP=1 -c "update relationship set data_status = 'official' where id in (${relation_1_id}, ${relation_2_id})"

          reviewer_user_id="$(jq -r '.data.id // empty' reviewer-register.json)"
          test -n "$reviewer_user_id"
          grant_http_status="$(jq -nc \
            --argjson userId "$reviewer_user_id" \
            --argjson scopeId "$core_clan_id" \
            '{userId:$userId,roleCode:"reviewer",scopeType:"clan",scopeId:$scopeId,reason:"功能测试授予独立审核员"}' \
            | curl --silent --show-error \
                -o reviewer-grant.json \
                -w '%{http_code}' \
                -b editor.cookies \
                -H 'Content-Type: application/json' \
                -H "X-CSRF-Token: ${editor_csrf}" \
                --data-binary @- \
                "http://127.0.0.1:8080/api/v1/clans/${core_clan_id}/member-grants")"
          echo "reviewer grant http=${grant_http_status}"
          cat reviewer-grant.json
          test "$grant_http_status" -ge 200 && test "$grant_http_status" -lt 300
          jq -e '.success == true and (.data.grantId != null)' reviewer-grant.json >/dev/null

          {
            echo "FUNCTIONAL_TEST_CORE_CLAN_ID=${core_clan_id}"
            echo "FUNCTIONAL_TEST_CORE_BRANCH_ID=${core_branch_id}"
            echo "FUNCTIONAL_TEST_CORE_ROOT_PERSON_ID=${root_person_id}"
            echo "FUNCTIONAL_TEST_CORE_CHILD_PERSON_ID=${child_person_id}"
          } >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        working-directory: frontend/genealogy-web
        run: npm install

      - name: Install Chromium
        working-directory: frontend/genealogy-web
        run: npx playwright install --with-deps chromium

      - name: Start functional frontend
        working-directory: frontend/genealogy-web
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 > ../../frontend-functional.log 2>&1 &
          echo $! > ../../frontend-functional.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5179/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become ready" >&2
          tail -n 200 ../../frontend-functional.log || true
          exit 1

      - name: Run real Playwright functional tests
        working-directory: frontend/genealogy-web
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e:real 2>&1 | tee ../../playwright-real.log

      - name: Print service diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo '===== PostgreSQL integration ====='
          tail -n 200 postgresql-integration.log || true
          echo '===== Seed ====='
          tail -n 300 seed-functional.log || true
          echo '===== Backend ====='
          tail -n 300 backend-functional.log || true
          echo '===== Frontend ====='
          tail -n 200 frontend-functional.log || true
          echo '===== Playwright ====='
          tail -n 300 playwright-real.log || true

      - name: Upload functional test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            postgresql-integration.log
            seed-functional.log
            core-clan.json
            core-branch.json
            core-root-person.json
            core-middle-person.json
            core-child-person.json
            core-relation-1.json
            core-relation-2.json
            reviewer-grant.json
            backend-functional.log
            frontend-functional.log
            playwright-real.log
            backend/genealogy-backend/target/failsafe-reports/**
            backend/genealogy-backend/target/surefire-reports/**
            frontend/genealogy-web/test-results/real-e2e/**
            frontend/genealogy-web/playwright-report-real/**
          if-no-files-found: warn
          retention-days: 14

      - name: Stop functional services
        if: always()
        shell: bash
        run: |
          if [[ -f frontend-functional.pid ]]; then kill "$(cat frontend-functional.pid)" 2>/dev/null || true; fi
          if [[ -f backend-functional.pid ]]; then kill "$(cat backend-functional.pid)" 2>/dev/null || true; fi
