name: Backend CI

on:
  push:
    branches: ["main"]
    paths:
      - "backend/genealogy-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/genealogy-backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: Architecture, Tests, Coverage and Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run backend verification gates
        working-directory: backend/genealogy-backend
        run: mvn -B -DskipITs verify

      - name: Upload backend quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-reports
          path: |
            backend/genealogy-backend/target/surefire-reports
            backend/genealogy-backend/target/site/jacoco
            backend/genealogy-backend/target/spotbugsXml.xml
            backend/genealogy-backend/target/spotbugs.html
          if-no-files-found: ignore
          retention-days: 7

  dependency-vulnerability-scan:
    name: Critical Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Scan dependencies and block critical findings
        working-directory: backend/genealogy-backend
        run: mvn -B -Pdependency-vulnerability-scan -DskipTests verify

      - name: Upload vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-vulnerability-reports
          path: |
            backend/genealogy-backend/target/dependency-check-report.html
            backend/genealogy-backend/target/dependency-check-report.json
          if-no-files-found: ignore
          retention-days: 14
