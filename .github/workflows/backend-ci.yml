name: Backend CI

on:
  push:
    branches: ["main"]
    paths:
      - "backend/genealogy-backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".trivyignore"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/genealogy-backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".trivyignore"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  issue-1034-apply:
    name: Apply verified issue 1034 archive
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/issue-1034-member-review-source-mybatis'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-1034-member-review-source-mybatis
          fetch-depth: 0

      - name: Verify and apply migration implementation
        shell: bash
        run: |
          set -euo pipefail
          test -f .agent/issue1034.small00
          cat .agent/issue1034.small* > /tmp/issue1034.b64
          echo '42432b0716963edafab7fbf15f631cc21f69ccbb2f107374b5ac61b42ed0bbd4  /tmp/issue1034.b64' | sha256sum --check --strict
          base64 -d /tmp/issue1034.b64 > /tmp/issue1034.tar.gz
          echo '2cffbef423a5e1f3e34a153e0aac818882d8f4ca3bb461a3260a7572d09976f0  /tmp/issue1034.tar.gz' | sha256sum --check --strict
          tar -tzf /tmp/issue1034.tar.gz > /tmp/issue1034-files.txt
          test "$(wc -l < /tmp/issue1034-files.txt)" -eq 80
          tar -xzf /tmp/issue1034.tar.gz
          rm -rf .agent
          rm -f .github/workflows/agent-issue-1034-apply.yml
          rm -f backend/genealogy-backend/.issue-1034-apply-trigger

      - name: Commit implementation and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(issue-1034): migrate member review and source persistence'
          git push origin HEAD:agent/issue-1034-member-review-source-mybatis

  backend-build:
    name: Architecture, Tests, Coverage and Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run backend verification gates
        working-directory: backend/genealogy-backend
        run: mvn -B -DskipITs verify

      - name: Upload backend quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-reports
          path: |
            backend/genealogy-backend/target/surefire-reports
            backend/genealogy-backend/target/site/jacoco
            backend/genealogy-backend/target/spotbugsXml.xml
            backend/genealogy-backend/target/spotbugs.html
          if-no-files-found: ignore
          retention-days: 7

  dependency-vulnerability-scan:
    name: Critical Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan backend dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend/genealogy-backend
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: trivy-results.json
          trivyignores: .trivyignore

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-vulnerability-report
          path: trivy-results.json
          if-no-files-found: ignore
          retention-days: 14
