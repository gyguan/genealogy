name: Backend CI

on:
  push:
    branches: ["main"]
    paths:
      - "backend/genealogy-backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".trivyignore"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/genealogy-backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".trivyignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: Architecture, Tests, Coverage and Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run backend verification gates
        working-directory: backend/genealogy-backend
        run: mvn -B -DskipITs verify

      - name: Upload backend quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-reports
          path: |
            backend/genealogy-backend/target/surefire-reports
            backend/genealogy-backend/target/site/jacoco
            backend/genealogy-backend/target/spotbugsXml.xml
            backend/genealogy-backend/target/spotbugs.html
          if-no-files-found: ignore
          retention-days: 7

  dependency-vulnerability-scan:
    name: Critical Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan backend dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend/genealogy-backend
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: trivy-results.json
          trivyignores: .trivyignore

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-vulnerability-report
          path: trivy-results.json
          if-no-files-found: ignore
          retention-days: 14
