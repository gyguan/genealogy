name: Issue 945 Style Fix
on:
  push:
    branches: [agent/issue-945-business-visual-boundaries]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-945-business-visual-boundaries
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('frontend/genealogy-web/src/auth-commercial.css')
          s=p.read_text()
          target='  .commercial-auth-capabilities,\n  .commercial-auth-lineage { display: none; }\n'
          if target not in s: raise SystemExit('target not found')
          p.write_text(s.replace(target, ''))
          PY
          rm .github/workflows/issue-945-style-fix.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/genealogy-web/src/auth-commercial.css .github/workflows/issue-945-style-fix.yml
          git commit -m "fix(styles): keep issue 945 A-class debt at zero"
          git push origin HEAD:agent/issue-945-business-visual-boundaries
