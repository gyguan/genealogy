name: Issue 943 Query Action Codemod

on:
  push:
    branches:
      - agent/issue-943-standard-query-actions
    paths:
      - scripts/issue-943-codemod.mjs
      - .github/workflows/issue-943-codemod.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-943-standard-query-actions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run one-time codemod
        run: node scripts/issue-943-codemod.mjs
      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(frontend): unify query action contracts for issue #943"
          git push origin HEAD:agent/issue-943-standard-query-actions
