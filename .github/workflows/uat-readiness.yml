name: Business UAT Readiness

on:
  pull_request:
    branches: ["main"]
    paths:
      - "docs/testing/uat/**"
      - "scripts/uat/**"
      - "tasks/issue-874*.md"
      - ".github/workflows/uat-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uat-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-uat-pack:
    name: Validate role scenarios and signoff controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate UAT package
        run: node scripts/uat/validate-uat-pack.mjs
      - name: Verify signoff is not fabricated
        run: |
          grep -q '自动化账号、开发人员或 AI 不得代签' docs/testing/uat/issue-874-signoff-template.md
          jq -e '.readyForBusinessUat == true and .automatedSignoff == false and .roles == 5 and .p0Tasks >= 8' uat-results/uat-readiness.json
      - name: Upload UAT readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: uat-readiness-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/testing/uat
            uat-results
          if-no-files-found: error
          retention-days: 30
