name: Visual Release Gate

on:
  pull_request:
    branches: ["main"]
    paths:
      - "frontend/genealogy-web/src/**/*.css"
      - "frontend/genealogy-web/src/styles/**"
      - "frontend/genealogy-web/src/shared/styles/**"
      - "frontend/genealogy-web/src/features/**"
      - "frontend/genealogy-web/e2e/culture-*.spec.ts"
      - "frontend/genealogy-web/e2e/css-desktop-viewport-matrix.spec.ts"
      - "frontend/genealogy-web/e2e/css-desktop-viewport-matrix.spec.ts-snapshots/**"
      - "frontend/genealogy-web/package.json"
      - ".github/workflows/culture-page-gate.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-release-gate:
    name: Visual Shell and Chromium Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/genealogy-web/package.json

      - name: Install dependencies
        working-directory: frontend/genealogy-web
        run: npm install

      - name: Run culture shell tests
        working-directory: frontend/genealogy-web
        run: npm run test:culture-shell

      - name: Run DOM and CSS governance
        working-directory: frontend/genealogy-web
        run: npm run test:dom-governance

      - name: Typecheck frontend
        working-directory: frontend/genealogy-web
        run: npm run typecheck

      - name: Build production frontend
        working-directory: frontend/genealogy-web
        run: npm run build

      - name: Install Chromium
        working-directory: frontend/genealogy-web
        run: npx playwright install --with-deps chromium

      - name: Start frontend
        working-directory: frontend/genealogy-web
        shell: bash
        run: |
          npm run dev > /tmp/visual-release-vite.log 2>&1 &
          echo $! > /tmp/visual-release-vite.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5179/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/visual-release-vite.log
          exit 1

      - name: Generate initial Chromium visual baselines
        working-directory: frontend/genealogy-web
        env:
          E2E_BROWSER_PROJECT: chromium
          E2E_DEVICE_SCALE_FACTOR: "1"
        run: npx playwright test e2e/css-desktop-viewport-matrix.spec.ts --update-snapshots

      - name: Upload viewport, local baseline and report evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-release-gate-evidence
          path: |
            frontend/genealogy-web/playwright-report-browser
            frontend/genealogy-web/test-results
            frontend/genealogy-web/e2e/css-desktop-viewport-matrix.spec.ts-snapshots
            /tmp/visual-release-vite.log
          if-no-files-found: ignore
          retention-days: 14
