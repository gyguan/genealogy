name: Issue 927 Refactor
on:
  push:
    branches: [agent/issue-927-relation-category]
    paths:
      - scripts/issue_927_refactor.py
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-927-relation-category
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/issue_927_refactor.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor(relationship): centralize category model"
          git push
