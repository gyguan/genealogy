name: Issue 934 client patch

on:
  push:
    branches:
      - agent/issue-934-antd-governance
    paths:
      - .github/workflows/issue-934-client-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-934-antd-governance
          fetch-depth: 0
      - name: Apply precise duplicate-person confirmation patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('frontend/genealogy-web/src/shared/api/client.ts')
          text = path.read_text()
          if "import { confirmAction } from '../ui/Feedback';" not in text:
              text = "import { confirmAction } from '../ui/Feedback';\n\n" + text

          old = """        const ok = window.confirm('发现疑似重复人物。确认仍要创建这条人物记录吗？');
                  if (ok) {
                    return this.request<T>(path, {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ ...(normalizedBody as Record<string, unknown>), confirmDuplicate: true })
                    });
                  }"""
          new = """        const ok = await new Promise<boolean>(resolve => {
                  confirmAction({
                    title: '确认创建疑似重复人物？',
                    content: '系统发现可能重复的人物档案。请确认信息无误后继续创建。',
                    okText: '仍要创建',
                    cancelText: '返回检查',
                    okButtonProps: { danger: true },
                    onOk: () => resolve(true),
                    onCancel: () => resolve(false)
                  });
                });
                if (ok) {
                  return this.request<T>(path, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...(normalizedBody as Record<string, unknown>), confirmDuplicate: true })
                  });
                }"""
          if old not in text:
              raise SystemExit('expected duplicate-person block not found')
          path.write_text(text.replace(old, new))
      - name: Restore permanent frontend CI workflow
        run: git show origin/main:.github/workflows/frontend-ci.yml > .github/workflows/frontend-ci.yml
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/issue-934-client-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/genealogy-web/src/shared/api/client.ts .github/workflows/frontend-ci.yml .github/workflows/issue-934-client-patch.yml
          git commit -m 'Replace duplicate person native confirmation'
          git push
