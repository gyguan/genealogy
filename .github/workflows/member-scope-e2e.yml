name: Member Branch Scope E2E

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "backend/genealogy-backend/**"
      - "frontend/genealogy-web/e2e-member-scope/**"
      - "frontend/genealogy-web/playwright.member-scope.config.ts"
      - "docs/testing/issue-834-execution.md"
      - ".github/workflows/member-scope-e2e.yml"

permissions:
  contents: read

concurrency:
  group: member-scope-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  member-scope-e2e:
    name: Member permission and workbench scope
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: genealogy
          POSTGRES_USER: genealogy
          POSTGRES_PASSWORD: genealogy
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U genealogy -d genealogy"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/genealogy
      SPRING_DATASOURCE_USERNAME: genealogy
      SPRING_DATASOURCE_PASSWORD: genealogy
      SPRING_PROFILES_ACTIVE: functional-test
      VITE_API_PROXY_TARGET: http://127.0.0.1:8080
      E2E_BASE_URL: http://127.0.0.1:5179
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: genealogy
      PGUSER: genealogy
      PGPASSWORD: genealogy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/genealogy-web/package.json

      - name: Generate isolated identities
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            echo "MEMBER_SCOPE_RUN_ID=gha-${suffix}"
            echo "MEMBER_SCOPE_ADMIN_USERNAME=scope_admin_${suffix}"
            echo "MEMBER_SCOPE_ADMIN_PASSWORD=$(openssl rand -hex 16)"
            echo "MEMBER_SCOPE_COLLABORATOR_USERNAME=scope_branch_${suffix}"
            echo "MEMBER_SCOPE_COLLABORATOR_PASSWORD=$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"

      - name: Build backend
        working-directory: backend/genealogy-backend
        run: mvn -B -DskipITs package

      - name: Start backend
        working-directory: backend/genealogy-backend
        shell: bash
        run: |
          set -euo pipefail
          java -jar target/genealogy-backend-0.1.0-SNAPSHOT.jar > ../../member-scope-backend.log 2>&1 &
          echo $! > ../../member-scope-backend.pid
          for attempt in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/8080) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          tail -n 300 ../../member-scope-backend.log || true
          exit 1

      - name: Seed member and branch scope scenario
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee member-scope-seed.log) 2>&1
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

          register_user() {
            local username="$1"
            local password="$2"
            local display_name="$3"
            jq -nc \
              --arg username "$username" \
              --arg password "$password" \
              --arg displayName "$display_name" \
              '{username:$username,password:$password,displayName:$displayName,phone:null,email:null}' \
              | curl --fail-with-body --silent --show-error \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  http://127.0.0.1:8080/api/v1/auth/register
          }

          register_user "$MEMBER_SCOPE_ADMIN_USERNAME" "$MEMBER_SCOPE_ADMIN_PASSWORD" "范围测试宗族管理员" > member-scope-admin-register.json
          register_user "$MEMBER_SCOPE_COLLABORATOR_USERNAME" "$MEMBER_SCOPE_COLLABORATOR_PASSWORD" "范围测试支派管理员" > member-scope-collaborator-register.json
          admin_user_id="$(jq -r '.data.id // empty' member-scope-admin-register.json)"
          collaborator_user_id="$(jq -r '.data.id // empty' member-scope-collaborator-register.json)"
          test -n "$admin_user_id" && test -n "$collaborator_user_id"

          jq -nc \
            --arg username "$MEMBER_SCOPE_ADMIN_USERNAME" \
            --arg password "$MEMBER_SCOPE_ADMIN_PASSWORD" \
            '{username:$username,password:$password,rememberMe:false}' \
            | curl --fail-with-body --silent --show-error \
                -c member-scope-admin.cookies \
                -H 'Content-Type: application/json' \
                --data-binary @- \
                http://127.0.0.1:8080/api/v1/auth/login \
                > member-scope-admin-login.json
          admin_csrf="$(jq -r '.data.csrfToken // empty' member-scope-admin-login.json)"
          test -n "$admin_csrf"

          clan_name="范围协作宗族-${MEMBER_SCOPE_RUN_ID}"
          jq -nc \
            --arg clanName "$clan_name" \
            '{clanCode:null,clanName:$clanName,surname:"黄",hallName:"协作堂",commandery:"江夏郡",originPlace:"CI",description:"#834 成员范围真实测试"}' \
            | curl --fail-with-body --silent --show-error \
                -b member-scope-admin.cookies \
                -H 'Content-Type: application/json' \
                -H "X-CSRF-Token: ${admin_csrf}" \
                --data-binary @- \
                http://127.0.0.1:8080/api/v1/clans \
                > member-scope-clan.json
          clan_id="$(jq -r '.data.id // empty' member-scope-clan.json)"
          test -n "$clan_id"

          create_branch() {
            local parent_id="$1"
            local branch_name="$2"
            local sort_order="$3"
            jq -nc \
              --argjson parentId "$parent_id" \
              --arg branchName "$branch_name" \
              --argjson sortOrder "$sort_order" \
              '{parentId:$parentId,branchName:$branchName,sortOrder:$sortOrder,founderPersonId:null,migrationFrom:"江夏",migrationTo:"长沙",managerMemberId:null,description:"#834 支派范围测试"}' \
              | curl --fail-with-body --silent --show-error \
                  -b member-scope-admin.cookies \
                  -H 'Content-Type: application/json' \
                  -H "X-CSRF-Token: ${admin_csrf}" \
                  --data-binary @- \
                  "http://127.0.0.1:8080/api/v1/clans/${clan_id}/branches"
          }

          root_branch_name="授权根支派-${MEMBER_SCOPE_RUN_ID}"
          child_branch_name="授权下级支派-${MEMBER_SCOPE_RUN_ID}"
          sibling_branch_name="兄弟支派-${MEMBER_SCOPE_RUN_ID}"
          create_branch null "$root_branch_name" 1 > member-scope-root-branch.json
          root_branch_id="$(jq -r '.data.id // empty' member-scope-root-branch.json)"
          test -n "$root_branch_id"
          psql -v ON_ERROR_STOP=1 -c "update branch set status = 'official' where id = ${root_branch_id}"

          create_branch "$root_branch_id" "$child_branch_name" 1 > member-scope-child-branch.json
          create_branch null "$sibling_branch_name" 2 > member-scope-sibling-branch.json
          child_branch_id="$(jq -r '.data.id // empty' member-scope-child-branch.json)"
          sibling_branch_id="$(jq -r '.data.id // empty' member-scope-sibling-branch.json)"
          test -n "$child_branch_id" && test -n "$sibling_branch_id"
          psql -v ON_ERROR_STOP=1 -c "update branch set status = 'official' where id in (${child_branch_id}, ${sibling_branch_id})"

          create_person() {
            local branch_id="$1"
            local person_code="$2"
            local person_name="$3"
            jq -nc \
              --argjson branchId "$branch_id" \
              --arg personCode "$person_code" \
              --arg name "$person_name" \
              '{branchId:$branchId,personCode:$personCode,name:$name,genealogyName:null,courtesyName:null,aliasName:null,gender:"male",generationNo:null,generationWord:null,rankInFamily:null,birthDate:null,birthDatePrecision:null,deathDate:null,deathDatePrecision:null,isLiving:false,birthPlace:null,residencePlace:null,occupation:null,education:null,titleOrHonor:null,biography:"#834 工作台范围测试人物",tombPlace:null,epitaph:null,hasDescendant:false,lineageStatus:"normal",privacyLevel:"clan_only",dataStatus:"draft",confirmDuplicate:true}' \
              | curl --fail-with-body --silent --show-error \
                  -b member-scope-admin.cookies \
                  -H 'Content-Type: application/json' \
                  -H "X-CSRF-Token: ${admin_csrf}" \
                  --data-binary @- \
                  "http://127.0.0.1:8080/api/v1/clans/${clan_id}/persons"
          }

          root_person_name="授权根人物-${MEMBER_SCOPE_RUN_ID}"
          child_person_name="授权下级人物-${MEMBER_SCOPE_RUN_ID}"
          child_person_two_name="授权下级人物二-${MEMBER_SCOPE_RUN_ID}"
          sibling_person_name="兄弟支派人物-${MEMBER_SCOPE_RUN_ID}"
          create_person "$root_branch_id" "MS-R-${GITHUB_RUN_ID}" "$root_person_name" > member-scope-root-person.json
          create_person "$child_branch_id" "MS-C1-${GITHUB_RUN_ID}" "$child_person_name" > member-scope-child-person.json
          create_person "$child_branch_id" "MS-C2-${GITHUB_RUN_ID}" "$child_person_two_name" > member-scope-child-person-two.json
          create_person "$sibling_branch_id" "MS-S-${GITHUB_RUN_ID}" "$sibling_person_name" > member-scope-sibling-person.json

          {
            echo "MEMBER_SCOPE_CLAN_ID=${clan_id}"
            echo "MEMBER_SCOPE_ROOT_BRANCH_ID=${root_branch_id}"
            echo "MEMBER_SCOPE_CHILD_BRANCH_ID=${child_branch_id}"
            echo "MEMBER_SCOPE_SIBLING_BRANCH_ID=${sibling_branch_id}"
            echo "MEMBER_SCOPE_ADMIN_USER_ID=${admin_user_id}"
            echo "MEMBER_SCOPE_COLLABORATOR_USER_ID=${collaborator_user_id}"
            echo "MEMBER_SCOPE_ROOT_PERSON_NAME=${root_person_name}"
            echo "MEMBER_SCOPE_CHILD_PERSON_NAME=${child_person_name}"
            echo "MEMBER_SCOPE_SIBLING_PERSON_NAME=${sibling_person_name}"
          } >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        working-directory: frontend/genealogy-web
        run: npm install

      - name: Install Chromium
        working-directory: frontend/genealogy-web
        run: npx playwright install --with-deps chromium

      - name: Start frontend
        working-directory: frontend/genealogy-web
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 > ../../member-scope-frontend.log 2>&1 &
          echo $! > ../../member-scope-frontend.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5179/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 200 ../../member-scope-frontend.log || true
          exit 1

      - name: Run member scope Playwright
        working-directory: frontend/genealogy-web
        shell: bash
        run: |
          set -o pipefail
          npx playwright test -c playwright.member-scope.config.ts 2>&1 | tee ../../member-scope-playwright.log

      - name: Print diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo '===== Seed ====='
          tail -n 300 member-scope-seed.log || true
          echo '===== Backend ====='
          tail -n 300 member-scope-backend.log || true
          echo '===== Frontend ====='
          tail -n 200 member-scope-frontend.log || true
          echo '===== Playwright ====='
          tail -n 300 member-scope-playwright.log || true

      - name: Upload member scope evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member-scope-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            member-scope-seed.log
            member-scope-backend.log
            member-scope-frontend.log
            member-scope-playwright.log
            member-scope-*.json
            frontend/genealogy-web/test-results/member-scope-e2e/**
            frontend/genealogy-web/playwright-report-member-scope/**
          if-no-files-found: warn
          retention-days: 14

      - name: Stop services
        if: always()
        shell: bash
        run: |
          if [[ -f member-scope-frontend.pid ]]; then kill "$(cat member-scope-frontend.pid)" 2>/dev/null || true; fi
          if [[ -f member-scope-backend.pid ]]; then kill "$(cat member-scope-backend.pid)" 2>/dev/null || true; fi
