name: Issue 943 Log Query Actions

on:
  push:
    branches:
      - agent/issue-943-standard-query-actions
    paths:
      - scripts/issue-943-log-query-actions.mjs
      - .github/workflows/issue-943-log-query-actions.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-943-standard-query-actions
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/issue-943-log-query-actions.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(frontend): migrate LogPage query action helper for issue #943"
          git push origin HEAD:agent/issue-943-standard-query-actions
