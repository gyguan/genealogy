name: Fresh Database Baseline Check
on:
  push:
    branches: [chore/fresh-database-baseline-20261012]
    paths:
      - 'database/bootstrap/**'
      - '.github/workflows/fresh-database-baseline.yml'
  pull_request:
    paths:
      - 'database/bootstrap/**'
      - '.github/workflows/fresh-database-baseline.yml'
      - 'backend/genealogy-backend/src/main/resources/db/migration/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/genealogy-backend/pom.xml
      - name: Generate isolated PostgreSQL baseline and replay SQL
        run: bash database/bootstrap/generate-baseline.sh
      - name: Upload SQL and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-database-baseline
          path: database/bootstrap/generated/
          retention-days: 7
      - name: Commit verified SQL baseline to working branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/chore/fresh-database-baseline-20261012'
        run: |
          mkdir -p backend/genealogy-backend/src/main/resources/db/baseline
          cp database/bootstrap/generated/V1__create_current_schema.sql backend/genealogy-backend/src/main/resources/db/baseline/V1__create_current_schema.sql
          cp database/bootstrap/generated/V2__seed_system_authorization.sql backend/genealogy-backend/src/main/resources/db/baseline/V2__seed_system_authorization.sql
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/genealogy-backend/src/main/resources/db/baseline/
          if ! git diff --cached --quiet; then
            git commit -m 'chore(db): snapshot verified fresh-install schema and RBAC'
            git push origin HEAD:chore/fresh-database-baseline-20261012
          fi
