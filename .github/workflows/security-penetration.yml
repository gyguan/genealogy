name: Security Penetration

on:
  pull_request:
    branches: ["main"]
    paths:
      - "backend/genealogy-backend/**"
      - "frontend/genealogy-web/**"
      - "security/**"
      - "docs/testing/security/**"
      - "tasks/issue-871*.md"
      - ".github/workflows/security-penetration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-penetration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-security:
    name: Secret, dependency and filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trivy repository scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - name: Enforce fixable critical and high findings
        shell: bash
        run: |
          test -s trivy-results.json
          python3 - <<'PY'
          import json
          data=json.load(open('trivy-results.json'))
          findings=[]
          for result in data.get('Results') or []:
              target=result.get('Target','unknown')
              for v in result.get('Vulnerabilities') or []:
                  if v.get('Severity') in {'CRITICAL','HIGH'} and v.get('FixedVersion'):
                      findings.append({'target':target,'id':v.get('VulnerabilityID'),'package':v.get('PkgName'),'installed':v.get('InstalledVersion'),'fixed':v.get('FixedVersion'),'severity':v.get('Severity')})
          json.dump({'fixableCriticalHigh':findings,'count':len(findings)},open('trivy-gate.json','w'),indent=2)
          print(f'fixable CRITICAL/HIGH findings: {len(findings)}')
          for item in findings: print(item)
          if findings: raise SystemExit(1)
          PY
      - name: Archive static evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-static-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            trivy-results.json
            trivy-gate.json
          if-no-files-found: error
          retention-days: 14

  dynamic-security:
    name: PostgreSQL authenticated penetration suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: genealogy
          POSTGRES_USER: genealogy
          POSTGRES_PASSWORD: genealogy
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U genealogy -d genealogy"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      BASE_URL: http://127.0.0.1:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/genealogy
      SPRING_DATASOURCE_USERNAME: genealogy
      SPRING_DATASOURCE_PASSWORD: genealogy
      SPRING_PROFILES_ACTIVE: functional-test
      SECURITY_RESULTS_DIR: security-results
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build backend
        working-directory: backend/genealogy-backend
        run: mvn -B -DskipTests package
      - name: Start backend
        working-directory: backend/genealogy-backend
        shell: bash
        run: |
          set -euo pipefail
          java -jar target/genealogy-backend-0.1.0-SNAPSHOT.jar > ../../security-backend.log 2>&1 &
          echo $! > ../../security-backend.pid
          for attempt in $(seq 1 90); do
            if (echo > /dev/tcp/127.0.0.1/8080) >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          tail -n 300 ../../security-backend.log || true
          exit 1
      - name: Run authenticated penetration tests
        shell: bash
        run: bash security/issue-871/api-penetration.sh
      - name: Check backend logs for sensitive leakage
        if: always()
        shell: bash
        run: |
          mkdir -p security-results
          if grep -Eiq 'password=[^*[:space:]]|accessToken[=:][[:space:]]*[A-Za-z0-9._-]{20,}|BEGIN (RSA|OPENSSH|PRIVATE) KEY' security-backend.log; then
            echo 'Sensitive material detected in backend logs' | tee security-results/log-leakage.txt
            exit 1
          fi
          echo 'No plaintext password, access token or private key detected' > security-results/log-leakage.txt
      - name: Generate final security report
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, os
          out=pathlib.Path('security-results')
          summary=json.loads((out/'summary.json').read_text()) if (out/'summary.json').exists() else {'passed':0,'failed':1,'critical':0,'high':1}
          text=f'''# Issue #871 安全渗透测试报告\n\n- Commit: `{os.getenv("GITHUB_SHA","unknown")}`\n- Dynamic tests passed: {summary.get("passed",0)}\n- Dynamic tests failed: {summary.get("failed",0)}\n- Critical findings: {summary.get("critical",0)}\n- High findings: {summary.get("high",0)}\n\n覆盖认证、Token、CSRF、注销重放、跨宗族越权、SQL 注入诊断、路径遍历、账号枚举、错误泄漏、安全响应头和危险上传。\n'''
          (out/'security-report.md').write_text(text)
          PY
          cat security-results/security-report.md
      - name: Upload dynamic security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-dynamic-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            security-results
            security-backend.log
          if-no-files-found: error
          retention-days: 14
      - name: Stop backend
        if: always()
        run: |
          if [[ -f security-backend.pid ]]; then kill "$(cat security-backend.pid)" 2>/dev/null || true; fi
