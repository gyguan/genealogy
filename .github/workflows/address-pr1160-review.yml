name: Address PR 1160 review

on:
  push:
    branches:
      - agent/current-data-seed-factory
    paths:
      - .github/workflows/address-pr1160-review.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/current-data-seed-factory
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Apply deterministic review fixes
        run: python scripts/maintenance/address_pr1160_review.py

      - name: Run focused contract validation
        working-directory: backend/genealogy-backend
        run: mvn -B -q -Dtest=CurrentSeedDataContractTest test

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit review fixes and remove helper files
        run: |
          rm -f .github/workflows/address-pr1160-review.yml
          rm -f scripts/maintenance/address_pr1160_review.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(db): address seed data review feedback"
          git push origin HEAD:agent/current-data-seed-factory
