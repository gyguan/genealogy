name: Current Seed Data CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - "backend/genealogy-backend/src/main/resources/db/seed/current/**"
      - "backend/genealogy-backend/src/test/java/com/genealogy/database/CurrentSeedDataContractTest.java"
      - ".github/workflows/current-seed-data-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "backend/genealogy-backend/src/main/resources/db/seed/current/**"
      - "backend/genealogy-backend/src/test/java/com/genealogy/database/CurrentSeedDataContractTest.java"
      - ".github/workflows/current-seed-data-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  current-seed-postgres:
    name: Reset, Scenario and Performance Seed on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: genealogy
          POSTGRES_USER: genealogy
          POSTGRES_PASSWORD: genealogy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genealogy -d genealogy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/genealogy
      SPRING_DATASOURCE_USERNAME: genealogy
      SPRING_DATASOURCE_PASSWORD: genealogy
      SPRING_FLYWAY_ENABLED: "true"
      PGPASSWORD: genealogy
      DATABASE_URL: postgresql://genealogy@localhost:5432/genealogy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Run seed contract test
        working-directory: backend/genealogy-backend
        run: mvn -B -q -Dtest=CurrentSeedDataContractTest test

      - name: Apply all Flyway migrations through application startup
        working-directory: backend/genealogy-backend
        run: |
          mvn -B -q -DskipTests package
          java -jar target/genealogy-backend-0.1.0-SNAPSHOT.jar >/tmp/current-seed-backend.log 2>&1 &
          backend_pid=$!
          ready=false
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          kill "${backend_pid}" || true
          wait "${backend_pid}" || true
          if [ "${ready}" != "true" ]; then
            tail -n 300 /tmp/current-seed-backend.log || true
            exit 1
          fi

      - name: Reset and seed deterministic scenarios
        run: |
          seed_dir="backend/genealogy-backend/src/main/resources/db/seed/current"
          psql "${DATABASE_URL}" \
            -v environment=ci \
            -v confirm_reset=RESET_CURRENT_GENEALOGY_DATA \
            -f "${seed_dir}/00_reset_business_data.sql"
          psql "${DATABASE_URL}" -f "${seed_dir}/10_seed_current_scenarios.sql"
          psql "${DATABASE_URL}" -f "${seed_dir}/30_verify_seed_data.sql"

      - name: Generate bounded CI performance dataset and verify again
        run: |
          seed_dir="backend/genealogy-backend/src/main/resources/db/seed/current"
          psql "${DATABASE_URL}" \
            -v dataset_code=CI \
            -v person_count=1000 \
            -v branch_count=50 \
            -v children_per_parent=3 \
            -v events_per_person=2 \
            -v source_count=20 \
            -v culture_item_count=50 \
            -v migration_event_count=20 \
            -v review_count=100 \
            -v operation_log_count=1000 \
            -f "${seed_dir}/20_generate_performance_data.sql"
          psql "${DATABASE_URL}" -f "${seed_dir}/30_verify_seed_data.sql"

      - name: Collect row-count evidence
        if: always()
        run: |
          mkdir -p /tmp/current-seed-evidence
          cp /tmp/current-seed-backend.log /tmp/current-seed-evidence/backend-startup.log 2>/dev/null || true
          psql "${DATABASE_URL}" -X -A -F ',' -c "
            select c.clan_code,
                   (select count(*) from branch b where b.clan_id = c.id) as branches,
                   (select count(*) from person p where p.clan_id = c.id and p.deleted_at is null) as persons,
                   (select count(*) from relationship r where r.clan_id = c.id and r.deleted_at is null) as relationships
            from clan c
            where c.clan_code like 'SCENARIO-%' or c.clan_code like 'PERF-%'
            order by c.clan_code;
          " > /tmp/current-seed-evidence/row-counts.csv || true

      - name: Upload seed verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-seed-data-evidence
          path: /tmp/current-seed-evidence
          if-no-files-found: ignore
          retention-days: 7
