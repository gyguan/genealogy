name: Issue 1033 Focused Fix

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.ref == 'agent/issue-1033-person-mybatis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1033-person-mybatis
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply focused fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          def replace(path, old, new):
              file = root / path
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:100]!r}')
              file.write_text(text.replace(old, new))

          replace(
              'backend/genealogy-backend/src/test/java/com/genealogy/imports/application/ImportApplicationServiceRowStateTest.java',
              'import static org.mockito.ArgumentMatchers.anyLong;',
              'import static org.mockito.ArgumentMatchers.anyInt;\nimport static org.mockito.ArgumentMatchers.anyLong;'
          )
          replace(
              'backend/genealogy-backend/src/test/java/com/genealogy/imports/application/ImportApplicationServiceRowStateTest.java',
              'lenient().when(personRepository.findDuplicateCandidates(any())).thenReturn(List.of());',
              'lenient().when(personRepository.findDuplicateCandidates(\n                any(), any(), any(), any(), any(), any(), anyInt()\n        )).thenReturn(List.of());'
          )
          replace(
              'backend/genealogy-backend/src/test/java/com/genealogy/imports/application/ImportJobRowApplicationServiceTest.java',
              'when(personRepository.countDuplicates(any())).thenReturn(0L);',
              'when(personRepository.countDuplicates(any(), any(), any(), any(), any(), any())).thenReturn(0L);'
          )
          replace(
              'backend/genealogy-backend/src/test/java/com/genealogy/person/application/PersonDuplicateDetectionServiceTest.java',
              'import static org.mockito.ArgumentMatchers.any;',
              'import static org.mockito.ArgumentMatchers.any;\nimport static org.mockito.ArgumentMatchers.anyInt;'
          )
          replace(
              'backend/genealogy-backend/src/test/java/com/genealogy/person/application/PersonDuplicateDetectionServiceTest.java',
              'when(repository.findDuplicateCandidates(any(PersonDuplicateQuery.class)))\n                .thenReturn(List.of(candidate));',
              'when(repository.findDuplicateCandidates(\n                any(), any(), any(), any(), any(), any(), anyInt()\n        )).thenReturn(List.of(candidate));'
          )
          replace(
              'backend/genealogy-backend/src/main/java/com/genealogy/person/repository/PersonRepository.java',
              '        int updated = persistenceMapper.updateAllBatch(items);\n        if (updated != items.size()) {\n            throw new IllegalStateException("Person batch update expected " + items.size() + " rows but updated " + updated);\n        }',
              '        int updated = 0;\n        for (int start = 0; start < items.size(); start += ID_BATCH_SIZE) {\n            List<PersonEntity> batch = items.subList(start, Math.min(start + ID_BATCH_SIZE, items.size()));\n            updated += persistenceMapper.updateAllBatch(batch);\n        }\n        if (updated != items.size()) {\n            throw new IllegalStateException("Person batch update expected " + items.size() + " rows but updated " + updated);\n        }'
          )
          replace(
              'backend/genealogy-backend/src/main/java/com/genealogy/person/repository/PersonRepository.java',
              'return persistenceMapper.selectCount(Wrappers.emptyWrapper());',
              'return persistenceMapper.selectCount(Wrappers.<PersonEntity>lambdaQuery());'
          )
          replace(
              'backend/genealogy-backend/src/main/java/com/genealogy/person/repository/query/PersonSearchCriteria.java',
              'import java.util.Locale;\n',
              ''
          )
          replace(
              'backend/genealogy-backend/src/main/java/com/genealogy/person/repository/query/PersonSearchCriteria.java',
              'strings(query.genders(), true)',
              'strings(query.genders(), false)'
          )
          replace(
              'backend/genealogy-backend/src/main/java/com/genealogy/person/repository/query/PersonSearchCriteria.java',
              'strings(query.dataStatuses(), true)',
              'strings(query.dataStatuses(), false)'
          )
          replace(
              'backend/genealogy-backend/src/main/java/com/genealogy/person/repository/query/PersonSearchCriteria.java',
              '    private static List<String> strings(List<String> values, boolean lowerCase) {',
              '    private static List<String> strings(List<String> values, boolean ignoredLowerCase) {'
          )
          replace(
              'backend/genealogy-backend/src/main/java/com/genealogy/person/repository/query/PersonSearchCriteria.java',
              '                .map(value -> lowerCase ? value.toLowerCase(Locale.ROOT) : value)\n',
              ''
          )
          replace(
              'backend/genealogy-backend/src/main/java/com/genealogy/tree/repository/jpa/TreePersonJpaEntity.java',
              'import lombok.Setter;\n',
              'import lombok.Setter;\nimport org.hibernate.annotations.Immutable;\n'
          )
          replace(
              'backend/genealogy-backend/src/main/java/com/genealogy/tree/repository/jpa/TreePersonJpaEntity.java',
              '@Entity(name = "TreePersonJpaEntity")\n@Table(name = "person")',
              '@Entity(name = "TreePersonJpaEntity")\n@Table(name = "person")\n@Immutable'
          )
          PY
          git rm .github/workflows/issue-1033-ci-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(person): align migration tests and persistence boundaries"
          git push origin HEAD:agent/issue-1033-person-mybatis
