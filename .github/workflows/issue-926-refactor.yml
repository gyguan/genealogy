name: Issue 926 Refactor

on:
  push:
    branches:
      - agent/issue-926-tree-service-split
    paths:
      - scripts/refactor_issue_926.py

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-926-tree-service-split
          fetch-depth: 0
      - name: Apply atomic service split
        run: python scripts/refactor_issue_926.py
      - name: Commit refactor result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "complete issue 926 service split"
          git push origin HEAD:agent/issue-926-tree-service-split
