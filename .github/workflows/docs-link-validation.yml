name: Docs Link Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate documentation structure and links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          errors = []
          root_topics = [p for p in Path('docs').glob('*.md') if p.name != 'README.md']
          if root_topics:
              errors.append('专题 Markdown 仍位于 docs 根目录: ' + ', '.join(map(str, root_topics)))
          if Path('docs/test').exists():
              errors.append('docs/test 仍存在，应统一使用 docs/testing')

          link_re = re.compile(r'(?<!!)\[[^\]]*\]\(([^)]+)\)')
          for path in Path('.').rglob('*.md'):
              if any(part in {'.git', 'node_modules', 'target', 'dist'} for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              for raw in link_re.findall(text):
                  target = raw.strip().split('#', 1)[0]
                  if not target or target.startswith(('http://', 'https://', 'mailto:', '#')):
                      continue
                  target = target.strip('<>')
                  resolved = (path.parent / target).resolve()
                  if not resolved.exists():
                      errors.append(f'{path}: missing link target {raw}')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('Documentation structure and relative links are valid.')
          PY
