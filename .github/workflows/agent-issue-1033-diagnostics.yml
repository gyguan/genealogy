name: Agent Diagnose Issue 1033 PostgreSQL

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/issue-1033-person-mybatis' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1033-person-mybatis
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run focused PostgreSQL integration test
        working-directory: backend/genealogy-backend
        shell: bash
        run: |
          set +e
          mvn -B -DskipITs=false -Dit.test=PersonMybatisPostgreSqlIT verify > /tmp/issue-1033-maven.log 2>&1
          status=$?
          set -e
          mkdir -p ../../.github/agent
          {
            echo "exit_status=${status}"
            echo "=== failsafe summaries ==="
            grep -R -n -E "Tests run:|Failures:|Errors:|Caused by:|AssertionError|expected:|actual:|Exception" target/failsafe-reports 2>/dev/null || true
            echo "=== maven tail ==="
            tail -n 300 /tmp/issue-1033-maven.log
          } > ../../.github/agent/issue-1033-postgresql-diagnostic.txt
      - name: Commit diagnostic and self-clean workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-issue-1033-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(issue-1033): capture PostgreSQL diagnostic"
          git push origin HEAD:agent/issue-1033-person-mybatis
