name: Issue 1027 One-time Patch

on:
  push:
    branches:
      - agent/issue-1027-query-card-person-source-workbench
    paths:
      - .github/workflows/issue-1027-apply-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1027-query-card-person-source-workbench
      - name: Apply precise query card migrations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected block in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1))

