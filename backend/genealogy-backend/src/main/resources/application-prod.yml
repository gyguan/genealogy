spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true

server:
  forward-headers-strategy: framework

genealogy:
  auth:
    cookie-secure: true
    expose-bearer-token: false
    expose-reset-token: false
    public-registration-enabled: ${GENEALOGY_AUTH_PUBLIC_REGISTRATION_ENABLED:false}
    demo-mode-enabled: false

logging:
  level:
    root: INFO
    com.genealogy: INFO
