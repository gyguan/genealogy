spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  main:
    banner-mode: off

genealogy:
  auth:
    public-registration-enabled: false
    demo-mode-enabled: false
    expose-bearer-token: true
    cookie-secure: false
    cookie-same-site: Lax
  attachment:
    storage-root: ${java.io.tmpdir}/genealogy-integration-attachments

logging:
  level:
    com.genealogy: info
    org.testcontainers: info
